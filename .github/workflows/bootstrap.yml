# Cloud alternative to running setup.py locally.
#
# Before dispatching this workflow, create these repository secrets. They are
# intentionally secrets rather than workflow_dispatch inputs because GitHub
# does not mask free-text dispatch inputs:
#   BOOTSTRAP_GH_TOKEN       token from `gh auth token` (workflow + gist access)
#   BOOTSTRAP_BOT_TOKEN      official Discord bot token
#   BOOTSTRAP_ALT_TOKEN_1..4 alt user tokens (provide as many as ALT_COUNT)
#   BOOTSTRAP_GIST_ID        existing shared blocklist Gist ID (optional)
#   BOOTSTRAP_CONTROL_GIST_ID existing shared control Gist ID (optional)
#   BOOTSTRAP_OWNER_IDS is supplied as a masked workflow input (comma-separated)
#   BOOTSTRAP_TUNING_JSON    optional JSON tuning object
#
# The action checks out this core repo, runs the same standard-library
# bootstrap, creates the resources, uploads templates, configures secrets, and
# waits for each alt self-check.

name: "🧰 Bootstrap Ad Farm"

on:
  workflow_dispatch:
    inputs:
      owner_ids:
        description: "Authorized Discord user IDs, comma-separated"
        required: true
        type: string
      guild_id:
        description: "Numeric control server ID (required for this non-interactive workflow)"
        required: true
        type: string
      alt_count:
        description: "Number of alt accounts to configure (blank to infer existing alt repositories)"
        required: false
        default: ""
        type: string
      channel_ids:
        description: "Trading channel IDs, comma-separated (blank when using channel_names)"
        required: false
        default: ""
        type: string
      channel_names:
        description: "Trading channel names in the same order (optional)"
        required: false
        default: ""
        type: string
      force:
        description: "Overwrite existing GitHub secrets and variables"
        required: false
        default: false
        type: boolean
      abort_on_failure:
        description: "Stop when an alt self-check fails"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  bootstrap:
    name: Provision Discord, GitHub, and alt checks
    runs-on: ubuntu-latest
    # Alt self-checks run concurrently, but leave provisioning headroom for
    # API retries and GitHub Actions startup.
    timeout-minutes: 30
    env:
      # All token values below are masked repository secrets.
      GH_TOKEN: ${{ secrets.BOOTSTRAP_GH_TOKEN }}
      BOT_TOKEN: ${{ secrets.BOOTSTRAP_BOT_TOKEN }}
      OWNER_IDS: ${{ inputs.owner_ids }}
      GUILD_ID: ${{ inputs.guild_id }}
      ALT_COUNT: ${{ inputs.alt_count }}
      ALT_TOKEN_1: ${{ secrets.BOOTSTRAP_ALT_TOKEN_1 }}
      ALT_TOKEN_2: ${{ secrets.BOOTSTRAP_ALT_TOKEN_2 }}
      ALT_TOKEN_3: ${{ secrets.BOOTSTRAP_ALT_TOKEN_3 }}
      ALT_TOKEN_4: ${{ secrets.BOOTSTRAP_ALT_TOKEN_4 }}
      CHANNEL_IDS: ${{ inputs.channel_ids }}
      CHANNEL_NAMES: ${{ inputs.channel_names }}
      TUNING_JSON: ${{ secrets.BOOTSTRAP_TUNING_JSON }}
      GIST_ID: ${{ secrets.BOOTSTRAP_GIST_ID }}
      CONTROL_GIST_ID: ${{ secrets.BOOTSTRAP_CONTROL_GIST_ID }}
      SETUP_SKIP_AUTH_REFRESH: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Mask bootstrap secrets
        shell: bash
        run: |
          for value in "$GH_TOKEN" "$BOT_TOKEN" "$OWNER_IDS" "$GUILD_ID" "$ALT_TOKEN_1" "$ALT_TOKEN_2" "$ALT_TOKEN_3" "$ALT_TOKEN_4" "$CHANNEL_IDS" "$CHANNEL_NAMES" "$TUNING_JSON" "$GIST_ID" "$CONTROL_GIST_ID"; do
            if [[ -n "$value" ]]; then
              printf '::add-mask::%s\n' "$value"
            fi
          done

      - name: Check out core repository
        uses: actions/checkout@v4

      - name: Run non-interactive bootstrap
        shell: bash
        run: |
          args=(--non-interactive)
          if [[ "${{ inputs.force }}" == "true" ]]; then
            args+=(--force)
          fi
          if [[ "${{ inputs.abort_on_failure }}" == "true" ]]; then
            args+=(--abort-on-failure)
          fi
          python setup.py "${args[@]}"