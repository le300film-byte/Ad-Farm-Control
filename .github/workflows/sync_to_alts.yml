# --------------------------------------------------------------------------- #
# SYNC_TO_ALTS — Push V6 updates to every alt repo automatically.           #
# --------------------------------------------------------------------------- #
# When you edit `send_ads.py` or the per-alt workflow in THIS core repo and
# push to main, this job iterates over every repo listed in ALT_REPOS and
# writes the same files into each alt's default/main branch via the GitHub
# Contents API. You can also fire it manually from the Actions tab.
#
# Required secrets (set on the CORE repo that hosts this workflow):
#   GH_TOKEN    — the token returned by `gh auth token`, with access to the
#                 core/alt repositories and Gists.
#   ALT_REPOS   — 1:alt1-sell,2:alt2-sell,3:alt3-buy,4:alt4-buy
#   ALT_GITHUB_OWNER — owner/org selected for the alt repositories
#
# Optional repo vars:
#   SYNC_BRANCH — Target branch on alt repos (default: main)
# --------------------------------------------------------------------------- #

name: "Sync V6 to Alt Repos"

on:
  push:
    branches: [main]
    paths:
      - "send_ads.py"
      - ".github/workflows/send_ads.yml"
      - ".github/workflows/sync_to_alts.yml"
      - ".github/workflows/self_check.yml"
  workflow_dispatch:
    inputs:
      message:
        description: "Commit message (optional)"
        required: false
        default: ""
      repos_override:
        description: "Comma-separated alt repos (leave empty to use ALT_REPOS secret)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  sync:
    name: "Push updates to alt repos"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Checkout core repo"
        uses: actions/checkout@v4

      - name: "Sync files to each alt repo"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_PAT }}
          ALT_REPOS: ${{ secrets.ALT_REPOS }}
          GITHUB_OWNER: ${{ secrets.ALT_GITHUB_OWNER }}
          SYNC_BRANCH: ${{ vars.SYNC_BRANCH || 'main' }}
          MANUAL_MSG: ${{ github.event.inputs.message }}
          REPOS_OVERRIDE: ${{ github.event.inputs.repos_override }}
          GITHUB_SHA: ${{ github.sha }}
          CORE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # For manual dispatches there is no head_commit event; use the
          # checked-out source commit message as the fallback.
          export CORE_COMMIT_MESSAGE="${CORE_COMMIT_MESSAGE:-$(git log -1 --format=%B)}"
          cat > /tmp/sync.py <<'PYEOF'
          import base64, json, os, sys, urllib.request, urllib.error

          TOKEN   = os.environ["GH_TOKEN"]
          BRANCH  = os.environ.get("SYNC_BRANCH", "main")
          SHA     = os.environ.get("GITHUB_SHA", "")
          SOURCE_MSG = os.environ.get("CORE_COMMIT_MESSAGE", "").strip()
          MANUAL  = os.environ.get("MANUAL_MSG", "").strip()
          OVERRIDE= os.environ.get("REPOS_OVERRIDE", "").strip()
          ALT_REPOS = os.environ.get("ALT_REPOS", "").strip()
          OWNER = os.environ.get("GITHUB_OWNER", "").strip()

          FILES = ["send_ads.py", ".github/workflows/send_ads.yml", ".github/workflows/self_check.yml"]
          COMMIT_MSG = MANUAL or SOURCE_MSG or f"sync: push updates from core ({SHA[:8]})"

          repos_csv = OVERRIDE if OVERRIDE else ALT_REPOS
          if not repos_csv:
              print("::error::No alt repos configured. Set ALT_REPOS secret or pass repos_override.")
              sys.exit(1)

          repos = []
          for raw_repo in repos_csv.split(","):
              raw_repo = raw_repo.strip()
              if not raw_repo:
                  continue
              # Accept the bootstrap's 1:repo form as well as owner/repo.
              if ":" in raw_repo and raw_repo.split(":", 1)[0].isdigit():
                  raw_repo = raw_repo.split(":", 1)[1].strip()
              if "/" not in raw_repo and OWNER:
                  raw_repo = f"{OWNER}/{raw_repo}"
              repos.append(raw_repo)
          API = "https://api.github.com"
          HDRS = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def gh(method, path, body=None):
              req = urllib.request.Request(f"{API}{path}", headers=HDRS, method=method)
              data = None
              if body is not None:
                  data = json.dumps(body).encode()
              try:
                  with urllib.request.urlopen(req, data=data, timeout=30) as resp:
                      return resp.status, json.loads(resp.read() or b"{}")
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, json.loads(e.read() or b"{}")
                  except Exception:
                      return e.code, {}

          ok = 0
          fail = 0
          skip = 0

          for repo in repos:
              print()
              print("=" * 60)
              print(f"::group::Syncing to {repo} (branch: {BRANCH})")
              for rel in FILES:
                  if not os.path.isfile(rel):
                      print(f"  SKIP {rel} — not present in core repo")
                      skip += 1
                      continue
                  print(f"  FILE {rel}")
                  # Read local file content & base64-encode (GitHub API wants base64)
                  with open(rel, "rb") as f:
                      content_b64 = base64.b64encode(f.read()).decode()

                  # Get existing file SHA (404 means it doesn't exist yet)
                  code, existing = gh("GET", f"/repos/{repo}/contents/{rel}?ref={BRANCH}")
                  cur_sha = existing.get("sha") if code == 200 else None

                  # PUT to create or update
                  put_body = {
                      "message": COMMIT_MSG,
                      "content": content_b64,
                      "branch": BRANCH,
                  }
                  if cur_sha:
                      put_body["sha"] = cur_sha

                  code2, resp = gh("PUT", f"/repos/{repo}/contents/{rel}", put_body)
                  if 200 <= code2 < 300:
                      verb = "Updated" if cur_sha else "Created"
                      print(f"    OK   {verb} (HTTP {code2})")
                      ok += 1
                  else:
                      msg = resp.get("message", "")
                      print(f"    FAIL (HTTP {code2}) {msg}")
                      fail += 1
              print("::endgroup::")

          print()
          print("=" * 60)
          print(f"SYNC SUMMARY: {ok} updated/created, {skip} skipped, {fail} failed")
          print("=" * 60)
          if fail > 0:
              print(f"::error::{fail} repo(s) failed to sync — see logs above.")
              sys.exit(1)
          PYEOF
          python3 /tmp/sync.py
