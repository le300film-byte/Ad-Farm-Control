# V6 CONTROL BOT — persistent owner-gated Discord control plane.
# GitHub Actions jobs are limited to six hours, so a scheduled or manually
# requested runtime is chained into sequential six-hour chunks. The bot is
# therefore continuously available without requiring daytime manual reruns.

name: "🤖 V6 Control Bot"

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Runtime to chain (hours; 6/12/18/24/48)"
        required: false
        default: "24"
        type: choice
        options: ["6", "12", "18", "24", "48"]
  schedule:
    # The default 24-hour chain keeps the control bot online around the clock.
    - cron: "0 10 * * *"
  push:
    branches: [main]
    paths:
      - "control_bot/**"
      - ".github/workflows/control_bot.yml"

permissions:
  contents: read

concurrency:
  group: control-bot
  # Queue the next daily chain instead of cancelling the currently connected
  # bot at the hand-off boundary. This prevents a daily schedule gap.
  cancel-in-progress: false

jobs:
  plan:
    name: Plan V6 runtime
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      chunk_minutes: ${{ steps.plan.outputs.chunk_minutes }}
    steps:
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          HOURS="${{ github.event.inputs.hours || '24' }}"
          case "$HOURS" in 6|12|18|24|48) ;; *) echo "::error::hours must be 6, 12, 18, 24, or 48"; exit 1 ;; esac
          CHUNKS=$(( (HOURS + 5) / 6 ))
          CHUNK_MIN=$(( HOURS * 60 / CHUNKS ))
          echo "chunks=$CHUNKS" >> "$GITHUB_OUTPUT"
          echo "chunk_minutes=$CHUNK_MIN" >> "$GITHUB_OUTPUT"
          echo "V6 control bot: $HOURS hour(s), $CHUNKS sequential chunk(s), $CHUNK_MIN minutes each."

  run-bot:
    name: "Run V6 control bot · chunk ${{ matrix.chunk }}"
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        chunk: [1, 2, 3, 4, 5, 6, 7, 8]
    timeout-minutes: 370
    steps:
      - name: Check whether this chunk is in the requested runtime
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.chunk }}" -le "${{ needs.plan.outputs.chunks }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "✅ Running control-bot chunk ${{ matrix.chunk }} / ${{ needs.plan.outputs.chunks }}"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping control-bot chunk ${{ matrix.chunk }}"
          fi

      - if: steps.check.outputs.run == 'true'
        uses: actions/checkout@v4

      - if: steps.check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.check.outputs.run == 'true'
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r control_bot/requirements.txt

      - name: Validate owner allow-list
        if: steps.check.outputs.run == 'true'
        env:
          OWNER_IDS: ${{ secrets.OWNER_IDS || secrets.OWNER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OWNER_IDS//[[:space:]]/}" ]]; then
            echo "::error::OWNER_IDS must contain at least one Discord user ID; refusing to start unrestricted control bot."
            exit 1
          fi
          IFS=',' read -ra IDS <<< "$OWNER_IDS"
          for id in "${IDS[@]}"; do
            id="${id//[[:space:]]/}"
            [[ "$id" =~ ^[0-9]+$ ]] || { echo "::error::OWNER_IDS contains a non-numeric ID"; exit 1; }
          done

      - name: Run V6 control bot
        if: steps.check.outputs.run == 'true'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          CONTROL_CH_ID: ${{ secrets.CONTROL_CH_ID }}
          DASHBOARD_CH_ID: ${{ secrets.DASHBOARD_CH_ID }}
          LOG_CH_ID: ${{ secrets.LOG_CH_ID }}
          DEALS_CH_ID: ${{ secrets.DEALS_CH_ID }}
          OWNER_IDS: ${{ secrets.OWNER_IDS || secrets.OWNER_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_PAT }}
          GITHUB_OWNER: ${{ secrets.ALT_GITHUB_OWNER }}
          CORE_REPO: ${{ github.repository }}
          CONTROL_GIST_ID: ${{ secrets.CONTROL_GIST_ID }}
          ALT_REPOS: ${{ secrets.ALT_REPOS }}
          ALT_DISCORD_IDS: ${{ secrets.ALT_DISCORD_IDS }}
          ALT_NAMES: ${{ secrets.ALT_NAMES }}
          TUNING_JSON: ${{ secrets.TUNING_JSON }}
          DASHBOARD_REFRESH_SEC: ${{ secrets.DASHBOARD_REFRESH_SEC }}
          OFFLINE_AFTER_SEC: ${{ secrets.OFFLINE_AFTER_SEC }}
          CMD_COOLDOWN_SEC: ${{ secrets.CMD_COOLDOWN_SEC }}
          CONTROL_HTTP_TIMEOUT: ${{ secrets.CONTROL_HTTP_TIMEOUT }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          CONTINUOUS_MODE: "1"
          SHUTDOWN_FLAG_FILE: /tmp/adfarm-shutdown.flag
          HEALTH_CHECK_INTERVAL_SEC: ${{ secrets.HEALTH_CHECK_INTERVAL_SEC || '300' }}
          PYTHONUNBUFFERED: "1"
        working-directory: ${{ github.workspace }}
        run: |
          echo "🤖 Starting V6 control bot chunk ${{ matrix.chunk }} at $(date -u +%H:%M:%SZ)..."
          CHUNK_MINUTES="${{ needs.plan.outputs.chunk_minutes }}"
          LOOP_END=$(( $(date +%s) + CHUNK_MINUTES * 60 ))
          set +e
          while [ "$(date +%s)" -lt "$LOOP_END" ]; do
            if [ -f "$SHUTDOWN_FLAG_FILE" ]; then
              echo "🛑 Shutdown flag present; ending control bot loop."
              break
            fi
            REMAINING_SEC=$(( LOOP_END - $(date +%s) ))
            echo "🤖 Starting control bot process at $(date -u +%H:%M:%SZ) (${REMAINING_SEC}s remaining)..."
            timeout --signal=TERM --kill-after=30s "${REMAINING_SEC}s" python -m control_bot
            rc=$?
            # timeout returns 124 when the planned chunk completed; treat that
            # as normal so the next sequential matrix chunk can take over.
            if [ "$rc" = "124" ]; then break; fi
            if [ "$rc" = "0" ]; then break; fi
            echo "⚠️ Control bot exited with code $rc; restarting automatically in 20s..."
            sleep 20
          done
          set -e
          sleep 20
