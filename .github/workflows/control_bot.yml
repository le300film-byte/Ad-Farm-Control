# V8 CONTROL BOT — Continuous 24/7 runtime.
# The bot runs in an infinite watchdog loop with auto-restart on crash.
# GitHub Actions jobs are limited to 6 hours; sequential matrix chunks chain
# across that boundary so the bot stays online indefinitely.
# Admin can stop the bot via the "Cancel workflow" button in GitHub Actions UI.

name: "🤖 V8 Control Bot"

on:
  workflow_dispatch:
  schedule:
    # Daily keepalive — chains the next 24-hour run automatically.
    - cron: "0 10 * * *"
  push:
    branches: [main]
    paths:
      - "control_bot/**"
      - "admin_commands.py"
      - "customer_manager.py"
      - "timer_engine.py"
      - "security.py"
      - "discord_forum.py"
      - "github_dispatch.py"
      - ".github/workflows/control_bot.yml"

permissions:
  contents: read

concurrency:
  group: control-bot
  # Queue the next run instead of cancelling the live bot during a chain handoff.
  cancel-in-progress: false

jobs:
  run-bot:
    name: "Run V8 control bot · chunk ${{ matrix.chunk }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      # 8 chunks × 350 minutes ≈ 46+ hours continuous — the daily schedule
      # picks up before this window exhausts to create a seamless 24/7 loop.
      matrix:
        chunk: [1, 2, 3, 4, 5, 6, 7, 8]
    timeout-minutes: 370

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r control_bot/requirements.txt
          # V8 extras
          pip install --quiet PyNaCl 2>/dev/null || true

      - name: Validate owner allow-list
        env:
          OWNER_IDS: ${{ secrets.OWNER_IDS || secrets.OWNER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OWNER_IDS//[[:space:]]/}" ]]; then
            echo "::error::OWNER_IDS must contain at least one Discord user ID."
            exit 1
          fi
          IFS=',' read -ra IDS <<< "$OWNER_IDS"
          for id in "${IDS[@]}"; do
            id="${id//[[:space:]]/}"
            [[ "$id" =~ ^[0-9]+$ ]] || { echo "::error::OWNER_IDS contains a non-numeric ID"; exit 1; }
          done

      - name: Run V8 control bot (chunk ${{ matrix.chunk }})
        env:
          BOT_TOKEN:                ${{ secrets.BOT_TOKEN }}
          GUILD_ID:                 ${{ secrets.GUILD_ID }}
          CONTROL_CH_ID:            ${{ secrets.CONTROL_CH_ID }}
          DASHBOARD_CH_ID:          ${{ secrets.DASHBOARD_CH_ID }}
          LOG_CH_ID:                ${{ secrets.LOG_CH_ID }}
          DEALS_CH_ID:              ${{ secrets.DEALS_CH_ID }}
          AUDIT_LOG_CH_ID:          ${{ secrets.AUDIT_LOG_CH_ID }}
          OWNER_IDS:                ${{ secrets.OWNER_IDS || secrets.OWNER_ID }}
          GH_TOKEN:                 ${{ secrets.GH_TOKEN || secrets.GITHUB_PAT }}
          GH_ADMIN_TOKEN:           ${{ secrets.GH_ADMIN_TOKEN }}
          GITHUB_OWNER:             ${{ secrets.ALT_GITHUB_OWNER }}
          CORE_REPO:                ${{ github.repository }}
          CONTROL_GIST_ID:          ${{ secrets.CONTROL_GIST_ID }}
          ALT_REPOS:                ${{ secrets.ALT_REPOS }}
          ALT_DISCORD_IDS:          ${{ secrets.ALT_DISCORD_IDS }}
          ALT_NAMES:                ${{ secrets.ALT_NAMES }}
          TUNING_JSON:              ${{ secrets.TUNING_JSON }}
          DASHBOARD_REFRESH_SEC:    ${{ secrets.DASHBOARD_REFRESH_SEC }}
          OFFLINE_AFTER_SEC:        ${{ secrets.OFFLINE_AFTER_SEC }}
          CMD_COOLDOWN_SEC:         ${{ secrets.CMD_COOLDOWN_SEC }}
          CONTROL_HTTP_TIMEOUT:     ${{ secrets.CONTROL_HTTP_TIMEOUT }}
          LOG_LEVEL:                ${{ secrets.LOG_LEVEL }}
          GITHUB_RUN_ID:            ${{ github.run_id }}
          CONTINUOUS_MODE:          "1"
          SHUTDOWN_FLAG_FILE:       /tmp/adfarm-shutdown.flag
          HEALTH_CHECK_INTERVAL_SEC: ${{ secrets.HEALTH_CHECK_INTERVAL_SEC || '300' }}
          PYTHONUNBUFFERED:         "1"
          CUSTOMERS_DB:             customers.db
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          CHUNK_MINUTES=350
          LOOP_END=$(( $(date +%s) + CHUNK_MINUTES * 60 ))
          echo "🤖 Starting V8 control bot — chunk ${{ matrix.chunk }} at $(date -u +%H:%M:%SZ)"
          echo "   Runs until $(date -u -d "@${LOOP_END}" +%H:%M:%SZ 2>/dev/null || date -u -r ${LOOP_END} +%H:%M:%SZ 2>/dev/null || echo '~350 min from now')"
          set +e
          while [ "$(date +%s)" -lt "$LOOP_END" ]; do
            if [ -f "$SHUTDOWN_FLAG_FILE" ]; then
              echo "🛑 Shutdown flag detected — halting control bot loop."
              break
            fi
            REMAINING=$(( LOOP_END - $(date +%s) ))
            echo "▶️  Launching bot process at $(date -u +%H:%M:%SZ) (${REMAINING}s remaining in chunk)"
            timeout --signal=TERM --kill-after=30s "${REMAINING}s" python -m control_bot
            rc=$?
            [ "$rc" = "124" ] && { echo "⏱️ Chunk time exhausted — handing off to next chunk."; break; }
            [ "$rc" = "0"   ] && { echo "✅ Bot exited cleanly."; break; }
            echo "⚠️  Bot exited with code $rc — restarting in 20s…"
            sleep 20
          done
          set -e
          echo "🔄 Chunk ${{ matrix.chunk }} complete."
