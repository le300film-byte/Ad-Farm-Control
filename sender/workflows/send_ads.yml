name: Marketplace Ad Sender

run-name: >-
  ${{
    (github.event.inputs.ad_type == 'sell'
      && format('💰 SELL ITEM @ {0}/1K', github.event.inputs.sell_rate || '2.5$')
      || (github.event.inputs.buy_style == 'simple'
        && format('🛒 BUY ALL ITEM | {0}', github.event.inputs.buy_simple_text || 'DM ME QUICK')
        || format('🛒 BUY ITEM @ tok {0}/1K · rap {1}/1K',
                  github.event.inputs.buy_rate || '2.2',
                  github.event.inputs.buy_rate_rap || '1.8')))
  }}
  | ${{ github.event.inputs.interval_min }}min × ${{ github.event.inputs.total_hours }}h
  ${{ github.event.inputs.attach_image == 'yes' && '| 📷img (after warmup)' || '' }}
  ${{ (github.event.inputs.channel_1 || github.event.inputs.channel_2) && '| 🎯 1-2 channels' || '' }}

on:
  workflow_dispatch:
    inputs:
      ad_type:
        description: 'Ad type (SELL or BUY)'
        required: true
        default: 'sell'
        type: choice
        options:
          - 'sell'
          - 'buy'

      # ---- Raw message (all modes) ----
      message:
        description: 'Optional exact message or question. When supplied, it is sent as the base copy; no item, price, or RAP is required.'
        required: false
        default: ''
        type: string

      # ---- SELL options ----
      sell_rate:
        description: '[SELL] Rate (e.g. 2.5$) — used in "SELLING BB LF X/1K"'
        required: false
        default: '2.5$'
        type: string
      sell_extra:
        description: '[SELL] Extra text after the rate'
        required: false
        default: 'DM ME QUICK CAN DO SMALL AND BIG AMOUNTS'
        type: string

      # ---- BUY options ----
      buy_style:
        description: '[BUY] Style: detailed = multi-line bullets, simple = single line (both support image after warmup)'
        required: false
        default: 'detailed'
        type: choice
        options:
          - 'detailed'
          - 'simple'
      buy_rate:
        description: '[BUY detailed] Tokens rate (e.g. 2.2)'
        required: false
        default: '2.2'
        type: string
      buy_rate_rap:
        description: '[BUY detailed] RAP rate (e.g. 1.8)'
        required: false
        default: '1.8'
        type: string
      buy_simple_text:
        description: '[BUY simple] Full message (e.g. BUYING ALL ITEM DM ME QUICK)'
        required: false
        default: 'BUYING ALL STOCK - INSTANT PAYMENT - DM ME'
        type: string

      # ---- Targeting ----
      channel_1:
        description: '[Optional] Single channel ID — if set, posts ONLY to this (and channel_2 if provided) instead of CHANNEL_IDS secret'
        required: false
        default: ''
        type: string
      channel_2:
        description: '[Optional] Second channel ID (leave blank to post to just channel_1)'
        required: false
        default: ''
        type: string
      channel_1_name:
        description: '[Optional V6] Channel NAME for channel_1 (e.g. "trading"). Lets the bot auto-discover the new ID if the channel gets deleted & recreated.'
        required: false
        default: ''
        type: string
      channel_2_name:
        description: '[Optional V6] Channel NAME for channel_2 (e.g. "market"). Same auto-discovery as channel_1_name.'
        required: false
        default: ''
        type: string

      # ---- Timing ----
      interval_min:
        description: 'Minutes between posts per channel (randomized ±25%)'
        required: false
        default: '5'
        type: choice
        options:
          - '3'
          - '5'
      total_hours:
        description: 'Total runtime (chained 6h chunks — max 48h)'
        required: false
        default: '6'
        type: choice
        options:
          - '6'
          - '12'
          - '18'
          - '24'
          - '48'
      runtime_limitless:
        description: 'Limitless mode: run indefinitely until the operator runs /shutdown (sets runtime budget to ∞; the Actions chain still uses up to 8 chunks per dispatch)'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
      attach_image:
        description: 'Attach image to every post after the 3-post text-only warmup? (applies to SELL and BUY in both simple/detailed styles)'
        required: false
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

concurrency:
  group: ad-sender-global
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.calc.outputs.chunks }}
      hours: ${{ steps.calc.outputs.hours }}
    steps:
      - id: calc
        shell: bash
        run: |
          set -euo pipefail
          HOURS="${{ github.event.inputs.total_hours || '6' }}"
          if [ -z "$HOURS" ] || [ "$HOURS" = "null" ]; then HOURS=6; fi
          LIMITLESS="${{ github.event.inputs.runtime_limitless || '0' }}"
          if [ "$LIMITLESS" = "1" ]; then
            HOURS=0
            echo "♾️ Limitless mode: no finite sender wall-clock; chaining up to 8 chunks per dispatch."
          fi
          if [ "$HOURS" = "0" ]; then BASE_HOURS=48; else BASE_HOURS=$HOURS; fi
          CHUNKS=$(( (BASE_HOURS + 5) / 6 ))
          if [ "$CHUNKS" -lt 1 ]; then CHUNKS=1; fi
          if [ "$CHUNKS" -gt 8 ]; then CHUNKS=8; fi
          echo "chunks=$CHUNKS" >> "$GITHUB_OUTPUT"
          echo "hours=$HOURS" >> "$GITHUB_OUTPUT"
          echo "🗓️  ${{ github.event.inputs.ad_type }} @ ${HOURS}h = $CHUNKS chunk(s)"

  send-chunk:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 380
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        chunk: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Check if this chunk should run
        id: check
        shell: bash
        run: |
          set -euo pipefail
          MAX="${{ needs.plan.outputs.chunks }}"
          CHUNK="${{ matrix.chunk }}"
          if [ -z "$MAX" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ chunks output was empty; skipping."
          elif [ "$CHUNK" -gt "$MAX" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping chunk $CHUNK (only $MAX needed)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "✅ Chunk $CHUNK / $MAX"
          fi

      - name: Gap between chunks
        if: steps.check.outputs.skip == 'false' && matrix.chunk > 1
        shell: bash
        run: |
          WAIT=$(( RANDOM % 181 + 120 ))
          echo "⏳ ${WAIT}s gap between chunks (simulating reconnect)..."
          sleep "$WAIT"

      - name: Checkout code
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: pip install --quiet 'curl-cffi>=0.10' 'Pillow>=10.0' 'websocket-client>=1.6'

      # ---------------------------------------------------------------- #
      # Decide whether WARP should run. GitHub Actions does NOT allow    #
      # `secrets.*` expressions directly in step-level `if:` conditions,  #
      # so we compute a boolean output via env first.                    #
      # ---------------------------------------------------------------- #
      - name: Decide WARP usage
        if: steps.check.outputs.skip == 'false'
        id: warp_check
        env:
          _HAS_PROXY: ${{ secrets.HTTPS_PROXY }}
          _WARP_OFF: ${{ secrets.WARP_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          # should_warp = true only if no proxy is configured AND WARP was
          # not explicitly disabled (WARP_ENABLED != "0").
          if [ -n "${_HAS_PROXY:-}" ]; then
            echo "should_warp=false" >> "$GITHUB_OUTPUT"
            echo "🔵 HTTPS_PROXY is set → skipping WARP."
          elif [ "${_WARP_OFF:-1}" = "0" ]; then
            echo "should_warp=false" >> "$GITHUB_OUTPUT"
            echo "⚠️  WARP_ENABLED=0 → skipping WARP (raw cloud IP — risky!)."
          else
            echo "should_warp=true" >> "$GITHUB_OUTPUT"
            echo "🟢 WARP will be enabled (no proxy detected, WARP not disabled)."
          fi

      # ---------------------------------------------------------------- #
      # Cloudflare WARP (free VPN/network) — better than raw Azure IPs. #
      # Uses the community action sebst/actions-warp@v1 which is widely  #
      # used on GitHub Marketplace. NO account / NO credit card / NO    #
      # signup — consumer mode `warp-cli registration new` is local &   #
      # anonymous. Installs the official cloudflare-warp package,       #
      # registers a fresh ephemeral consumer ID, sets mode warp+doh,    #
      # connects — system-level WireGuard tunnel routes all traffic     #
      # (Python, curl, websocket-client) via Cloudflare's network.      #
      #                                                                 #
      # Auto-SKIPPED if you set HTTPS_PROXY (residential proxy beats    #
      # WARP) or set WARP_ENABLED=0 to force-disable.                   #
      # ---------------------------------------------------------------- #
      - name: Cloudflare WARP (free anti-datacenter IP layer)
        if: steps.check.outputs.skip == 'false' && steps.warp_check.outputs.should_warp == 'true'
        # The action's built-in one-shot `warp=on` assertion is brittle on
        # hosted runners. The independent egress check below is authoritative
        # and still fails closed for an unverified/datacenter route.
        continue-on-error: true
        uses: sebst/actions-warp@v1
        with:
          tos: 'YES'

      # Hard check: verify the outbound IP is not a known datacenter before
      # we ever start the bot. If WARP/proxy failed silently, abort so we
      # never post from the raw runner route.
      - name: Verify egress is non-datacenter (abort if routing failed)
        if: steps.check.outputs.skip == 'false'
        id: warpcheck
        env:
          # HAS_PROXY is only a redacted indicator; these variables make curl
          # use the configured proxy while it measures the proxy's actual egress.
          HAS_PROXY: ${{ secrets.HTTPS_PROXY || secrets.HTTP_PROXY }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          WARP_OFF: ${{ secrets.WARP_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          echo "🔒 Checking outbound IP (with retries)..."
          IP="?"; ORG="?"; TRACE=""; WARP_ACTIVE=0
          # WARP can take 2-10s to actually switch routes after `warp-cli connect`
          # returns, so retry for up to 20s before declaring failure.
          for i in 1 2 3 4 5 6 7 8; do
            sleep 2
            TRACE=$(curl -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace || echo "")
            IP=$(curl -s --max-time 10 https://api.ipify.org || echo "?")
            ORG=$(curl -s --max-time 10 "https://ipapi.co/$IP/org" || echo "?")
            if echo "$TRACE" | grep -q "warp=on" || echo "$ORG" | grep -qi "cloudflare"; then
              WARP_ACTIVE=1
              break
            fi
            echo "   attempt $i: IP=$IP ORG=$ORG (not Cloudflare yet, retrying...)"
          done

          # Require a second, independent provider classification. A non-empty
          # ASN/org string alone is not proof that a route is outside a hosting
          # provider, so fail closed if IPWHO cannot verify the same egress IP.
          WHO_JSON=$(curl -fsS --max-time 15 "https://ipwho.is/$IP" || echo '{}')
          IFS=$'\t' read -r WHO_OK WHO_IP WHO_ORG WHO_COUNTRY WHO_HOSTING WHO_TYPE < <(
            WHO_JSON="$WHO_JSON" python3 - <<'PY'
          import json, os
          try:
              payload = json.loads(os.environ.get("WHO_JSON", "{}"))
              connection = payload.get("connection") or {}
              security = payload.get("security") or {}
              org = connection.get("org") or connection.get("isp") or ""
              kind = str(connection.get("type") or "").lower()
              hosting = bool(security.get("hosting")) or any(
                  marker in kind for marker in ("hosting", "datacenter", "data center")
              )
              ok = bool(payload.get("success", True)) and bool(org.strip())
              print("\t".join((str(int(ok)), str(payload.get("ip") or "?"),
                               org.strip(), str(payload.get("country_code") or "").upper(),
                               str(int(hosting)), kind)))
          except Exception:
              print("0\t?\t?\t?\t0\t?")
          PY
          )
          ORG="${WHO_ORG:-?}"
          echo "--- https://www.cloudflare.com/cdn-cgi/trace ---"
          echo "$TRACE" | grep -E "^(warp|ip|colo|loc)=" || echo "(no warp trace output)"
          echo "-----------------------------------------------"
          echo "   Outbound IP: $IP"
          echo "   Org        : $ORG"
          echo "   IPWHO type : ${WHO_TYPE:-?}"
          echo "   IPWHO host : ${WHO_HOSTING:-?}"

          if [ "$WHO_OK" != "1" ] || [ "$IP" = "?" ] || [ "$WHO_IP" != "$IP" ]; then
            echo "   ❌ Independent IP/provider verification failed or disagreed with ipify."
            echo "   ❌ Not starting without a verified classification of the actual egress."
            exit 1
          fi
          IS_CLOUDFLARE=0
          if echo "$ORG" | grep -qi "cloudflare\|as13335"; then IS_CLOUDFLARE=1; fi
          if { [ "$WHO_HOSTING" = "1" ] && [ "$IS_CLOUDFLARE" != "1" ]; } \
             || echo "$ORG" | grep -Eqi "microsoft|azure|amazon|aws|google|ovh|digitalocean|hetzner|oracle|linode|github|alibaba|tencent|digital ocean"; then
            echo "   ❌ Egress is classified as hosting/datacenter ($ORG / ${WHO_TYPE:-unknown})."
            echo "   ❌ Configure Cloudflare WARP or a verified residential HTTPS_PROXY/HTTP_PROXY and retry."
            exit 1
          fi

          if [ -n "${HAS_PROXY:-}" ]; then
            echo ""
            echo "🔵 HTTPS/HTTP proxy is set ($(echo "$HAS_PROXY" | sed 's#://[^/@]*:[^/@]*@#://***:***@#; s#://[^/@]*@#://***@#')) — actual proxy egress verified."
            echo "mode=proxy" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${WARP_OFF:-1}" = "0" ]; then
            echo ""
            echo "❌ WARP_ENABLED=0 with no configured proxy: no verified non-datacenter route is available."
            echo "❌ Refusing to start the sender on the raw GitHub/Azure runner IP."
            echo "   Configure WARP or a verified residential HTTPS_PROXY/HTTP_PROXY and retry."
            exit 1
          fi

          if [ "$WARP_ACTIVE" = "1" ]; then
            echo ""
            echo "   ✅ Cloudflare/WARP is ACTIVE — traffic leaves via a verified non-datacenter route."
            echo "mode=warp" >> "$GITHUB_OUTPUT"
          else
            echo ""
            echo "   ✅ Outbound organization is verified non-datacenter."
            echo "mode=verified" >> "$GITHUB_OUTPUT"
          fi

      # Resolve which channels to post to. If channel_1/channel_2 are filled in
      # the Run Workflow form, they OVERRIDE the CHANNEL_IDS secret for this run.
      # Also resolves CHANNEL_NAMES (V6) — positional match with CHANNEL_IDS
      # enables auto-discovery when a channel returns 404 (deleted & recreated).
      - name: Resolve target channels
        if: steps.check.outputs.skip == 'false'
        id: channels
        shell: bash
        env:
          CH1: ${{ github.event.inputs.channel_1 }}
          CH2: ${{ github.event.inputs.channel_2 }}
          CH1_NAME: ${{ github.event.inputs.channel_1_name }}
          CH2_NAME: ${{ github.event.inputs.channel_2_name }}
          SECRET_IDS: ${{ secrets.CHANNEL_IDS }}
          SECRET_NAMES: ${{ secrets.CHANNEL_NAMES }}
        run: |
          set -euo pipefail
          clean() { echo "${1//$'\r'/}" | tr -d '\n '; }
          cleantxt() { echo "${1//$'\r'/}" | tr -d '\n'; }
          C1="$(clean "$CH1")"
          C2="$(clean "$CH2")"
          N1="$(cleantxt "$CH1_NAME")"
          N2="$(cleantxt "$CH2_NAME")"

          if [ -n "$C1" ] || [ -n "$C2" ]; then
            CIDS=""
            CNAMES=""
            [ -n "$C1" ] && CIDS="$C1"
            [ -n "$C2" ] && CIDS="${CIDS:+$CIDS,}$C2"
            # Build positional names only when their positions are
            # unambiguous. A missing first name cannot be represented by the
            # sender's compact comma-separated parser without shifting the
            # second name onto channel one, so disable discovery for that case.
            if [ -n "$C1" ] && [ -n "$C2" ]; then
              if [ -n "$N1" ] && [ -n "$N2" ]; then
                CNAMES="$N1,$N2"
              else
                CNAMES=""
              fi
            elif [ -n "$C1" ] && [ -n "$N1" ]; then
              CNAMES="$N1"
            elif [ -z "$C1" ] && [ -n "$C2" ] && [ -n "$N2" ]; then
              CNAMES="$N2"
            fi
            echo "🎯 Using per-run channels: $CIDS"
            echo "   Channel names (V6 auto-discovery): ${CNAMES:-(none set — fill channel_1_name/channel_2_name to enable recovery on 404)}"
          else
            CIDS="$(clean "$SECRET_IDS")"
            CNAMES="$(cleantxt "$SECRET_NAMES")"
            echo "📡 Using full CHANNEL_IDS secret"
            [ -n "$CNAMES" ] && echo "   Channel names (V6): $CNAMES" || echo "   (no CHANNEL_NAMES secret — V6 auto-discovery disabled)"
          fi

          if [ -z "$CIDS" ] && [ -z "$CNAMES" ]; then
            echo "::error::No channels configured. Fill CHANNEL_IDS, CHANNEL_NAMES, or channel_1/channel_2 inputs."
            exit 1
          fi
          if [ -n "$CIDS" ]; then
            IFS=',' read -ra CID_LIST <<< "$CIDS"
            for cid in "${CID_LIST[@]}"; do
              if [[ ! "$cid" =~ ^[0-9]+$ ]]; then
                echo "::error::Channel ID '$cid' is not numeric."
                exit 1
              fi
            done
          else
            echo "🧭 No numeric IDs supplied; sender will safely resolve the channel name after authentication."
          fi
          echo "channels<<CH_EOF" >> "$GITHUB_OUTPUT"
          echo "$CIDS" >> "$GITHUB_OUTPUT"
          echo "CH_EOF" >> "$GITHUB_OUTPUT"
          echo "ch_names<<NM_EOF" >> "$GITHUB_OUTPUT"
          echo "$CNAMES" >> "$GITHUB_OUTPUT"
          echo "NM_EOF" >> "$GITHUB_OUTPUT"

      # Build the ad message inside this job (avoids cross-job multiline-output
      # edge cases and keeps IMAGE_FILENAME secret out of job outputs).
      - name: Build message + resolve image
        if: steps.check.outputs.skip == 'false'
        id: build
        shell: bash
        env:
          AD_TYPE: ${{ github.event.inputs.ad_type }}
          RAW_MESSAGE: ${{ github.event.inputs.message }}
          SELL_RATE: ${{ github.event.inputs.sell_rate }}
          SELL_EXTRA: ${{ github.event.inputs.sell_extra }}
          BUY_STYLE: ${{ github.event.inputs.buy_style }}
          BUY_RATE: ${{ github.event.inputs.buy_rate }}
          BUY_RAP: ${{ github.event.inputs.buy_rate_rap }}
          BUY_SIMPLE_TEXT: ${{ github.event.inputs.buy_simple_text }}
          ATTACH: ${{ github.event.inputs.attach_image }}
          IMAGE_FILENAME: ${{ secrets.IMAGE_FILENAME }}
          ITEM_NAME: ${{ secrets.DEFAULT_ITEM_NAME }}
        run: |
          set -euo pipefail
          clean() { echo "${1//$'\r'/}" | tr -d '\n'; }

          AD_TYPE_C="$(clean "$AD_TYPE")"
          RAW_MESSAGE_C="${RAW_MESSAGE//$'\r'/}"
          SELL_RATE_C="$(clean "$SELL_RATE")"
          SELL_EXTRA_C="$(clean "$SELL_EXTRA")"
          BUY_STYLE_C="$(clean "$BUY_STYLE")"
          BUY_RATE_C="$(clean "$BUY_RATE")"
          BUY_RAP_C="$(clean "$BUY_RAP")"
          BUY_SIMPLE_C="$(clean "$BUY_SIMPLE_TEXT")"
          ATTACH_C="$(clean "$ATTACH")"
          IMAGE_FILENAME_C="$(clean "$IMAGE_FILENAME")"
          ITEM_NAME_C="${ITEM_NAME:-ITEM}"
          [ -z "$ITEM_NAME_C" ] && ITEM_NAME_C="ITEM"

          if [ -n "$RAW_MESSAGE_C" ]; then
            MSG="$RAW_MESSAGE_C"
            HAS_IMAGE="$ATTACH_C"
          elif [ "$AD_TYPE_C" = "sell" ]; then
            MSG="$(printf 'SELLING %s LF %s/1K %s' "$ITEM_NAME_C" "$SELL_RATE_C" "$SELL_EXTRA_C")"
            HAS_IMAGE="$ATTACH_C"
          elif [ "$BUY_STYLE_C" = "simple" ]; then
            MSG="$BUY_SIMPLE_C"
            HAS_IMAGE="$ATTACH_C"
          else
            MSG="$(printf 'BUYING %s:\n\n-TOKENS %s/1K\n\n-RAP %s$/1K (nlf boosted)\n\nDM me quick' \
                   "$ITEM_NAME_C" "$BUY_RATE_C" "$BUY_RAP_C")"
            # Images now attach to ALL buy styles (simple + detailed) after warmup.
            HAS_IMAGE="$ATTACH_C"
          fi

          CHAR_COUNT="${#MSG}"
          LINE_COUNT="$(printf '%s\n' "$MSG" | wc -l)"
          echo "Ad type : $AD_TYPE_C (style: ${BUY_STYLE_C:---})"
          echo "Lines   : $LINE_COUNT"
          echo "Chars   : $CHAR_COUNT"
          echo "Image   : $HAS_IMAGE"
          echo "--- Message ---"
          echo "$MSG"
          echo "---------------"

          if [ "$CHAR_COUNT" -gt 1900 ]; then
            echo "::error::Message too long ($CHAR_COUNT chars, max 1900)."
            exit 1
          fi
          if [ -z "$MSG" ]; then
            echo "::error::Constructed message is empty!"
            exit 1
          fi

          if [ "$HAS_IMAGE" = "yes" ]; then
            if [ -n "$IMAGE_FILENAME_C" ]; then
              IMG_PATH="$IMAGE_FILENAME_C"
            else
              IMG_PATH="ad.png"
            fi
          else
            IMG_PATH=""
          fi
          echo "Image path: '${IMG_PATH}'"

          DELIM="EOF_$(openssl rand -hex 8 2>/dev/null || echo "9f8e7d6c5b4a3210")"
          # Auto-extract a numeric baseline rate for the deal scanner.
          # SELL RATE: sell_rate input (e.g. "2.5$" → 2.5)
          # BUY RATE:  buy_rate input (tokens)
          if [ "$AD_TYPE_C" = "sell" ]; then
            MY_RATE=$(printf '%s' "$SELL_RATE_C" | grep -oE '[0-9]+(\.[0-9]+)?' | head -n1)
          else
            MY_RATE=$(printf '%s' "$BUY_RATE_C" | grep -oE '[0-9]+(\.[0-9]+)?' | head -n1)
          fi
          echo "Deal-scanner baseline rate: ${MY_RATE:-'(none)'}"
          {
            echo "msg<<${DELIM}"
            echo "$MSG"
            echo "${DELIM}"
            echo "ad_type=${AD_TYPE_C}"
            echo "has_image=${HAS_IMAGE}"
            echo "image_path=${IMG_PATH}"
            echo "deal_my_rate=${MY_RATE}"
          } >> "$GITHUB_OUTPUT"

      - name: Run ad sender (6h chunk)
        if: steps.check.outputs.skip == 'false'
        env:
          USER_TOKEN: ${{ secrets.USER_TOKEN }}
          CHANNEL_IDS: ${{ steps.channels.outputs.channels }}
          AD_TYPE: ${{ steps.build.outputs.ad_type }}
          MESSAGE: ${{ steps.build.outputs.msg }}
          ATTACH_IMAGE: ${{ steps.build.outputs.has_image }}
          INTERVAL_MIN: ${{ github.event.inputs.interval_min }}
          TOTAL_RUN_MIN: 350
          TOTAL_HOURS: ${{ github.event.inputs.runtime_limitless == '1' && '0' || github.event.inputs.total_hours || '6' }}
          RUNTIME_LIMITLESS: ${{ github.event.inputs.runtime_limitless || '0' }}
          CHUNK_INDEX: ${{ matrix.chunk }}
          TOTAL_CHUNKS: ${{ needs.plan.outputs.chunks || '1' }}
          IMAGE_PATH: ${{ steps.build.outputs.image_path }}
          CUSTOM_STATUS_TEXT: ${{ secrets.CUSTOM_STATUS_TEXT }}
          STATUS_EMOJI: ${{ secrets.STATUS_EMOJI }}
          MIN_AFK_BREAKS: ${{ secrets.MIN_AFK_BREAKS }}
          MAX_AFK_BREAKS: ${{ secrets.MAX_AFK_BREAKS }}
          AFK_MIN_MIN: ${{ secrets.AFK_MIN_MIN }}
          AFK_MAX_MIN: ${{ secrets.AFK_MAX_MIN }}
          DISCORD_LOCALE: ${{ secrets.DISCORD_LOCALE }}
          DISCORD_TIMEZONE: ${{ secrets.DISCORD_TIMEZONE }}
          DEBUG: ${{ secrets.DEBUG }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          # Anti-detection knobs (all optional, sane defaults if empty)
          WARMUP_POSTS: ${{ secrets.WARMUP_POSTS }}
          STRIP_EXIF: ${{ secrets.STRIP_EXIF }}
          RANDOM_REACT: ${{ secrets.RANDOM_REACT }}
          PROXY_CHECK: ${{ secrets.PROXY_CHECK }}
          ENABLE_GATEWAY: ${{ secrets.ENABLE_GATEWAY }}
          TYPO_EDIT_CHANCE: ${{ secrets.TYPO_EDIT_CHANCE }}
          IMAGE_JITTER: ${{ secrets.IMAGE_JITTER }}
          SUPPRESS_EMBEDS: ${{ secrets.SUPPRESS_EMBEDS }}
          # V6: DM forwarding + auto-learn + geo-check (all optional)
          DM_WEBHOOK_URL: ${{ secrets.DM_WEBHOOK_URL }}
          LOG_WEBHOOK_URL: ${{ secrets.LOG_WEBHOOK_URL }}
          DASHBOARD_WEBHOOK_URL: ${{ secrets.DASHBOARD_WEBHOOK_URL }}
          DEAL_WEBHOOK_URL: ${{ secrets.DEAL_WEBHOOK_URL }}
          # Deal alerts use this separate webhook and never overwrite dashboard data.
          # Optional consolidated tuning object. Explicit workflow inputs above
          # still take precedence over values in this JSON object.
          TUNING_JSON: ${{ secrets.TUNING_JSON }}
          # Webhook timeouts (seconds). Default 20 for both; override if needed.
          WEBHOOK_TIMEOUT: ${{ secrets.WEBHOOK_TIMEOUT }}
          DM_WEBHOOK_TIMEOUT: ${{ secrets.DM_WEBHOOK_TIMEOUT }}
          DM_PAUSE_MINUTES: ${{ secrets.DM_PAUSE_MINUTES }}
          FORWARD_OWN_DMS: ${{ secrets.FORWARD_OWN_DMS }}
          BLOCKED_STRIKES: ${{ secrets.BLOCKED_STRIKES }}
          BLOCKED_SAFETY_STOP: ${{ secrets.BLOCKED_SAFETY_STOP }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          ALLOWED_COUNTRIES: ${{ secrets.ALLOWED_COUNTRIES }}
          # V6 safety features (all optional — sane defaults if empty).
          # DEAL_MY_RATE is auto-extracted from the chosen sell/buy rate inputs.
          DEAL_SCAN_ENABLED: ${{ secrets.DEAL_SCAN_ENABLED }}
          DEAL_MY_RATE: ${{ steps.build.outputs.deal_my_rate }}
          DEAL_ALERT_DELTA: ${{ secrets.DEAL_ALERT_DELTA }}
          DEAL_ITEM_KEYWORDS: ${{ secrets.DEAL_ITEM_KEYWORDS }}
          IP_HEALTH_CHECK_INTERVAL_MIN: ${{ secrets.IP_HEALTH_CHECK_INTERVAL_MIN }}
          IP_HEALTH_PAUSE_MIN: ${{ secrets.IP_HEALTH_PAUSE_MIN }}
          CAUTION_WINDOW: ${{ secrets.CAUTION_WINDOW }}
          CAUTION_FAIL_THRESHOLD: ${{ secrets.CAUTION_FAIL_THRESHOLD }}
          CAUTION_EXIT_STREAK: ${{ secrets.CAUTION_EXIT_STREAK }}
          CAUTION_INTERVAL_MULT: ${{ secrets.CAUTION_INTERVAL_MULT }}
          PANIC_TRUSTED_IDS: ${{ secrets.PANIC_TRUSTED_IDS }}
          PANIC_CHECK_INTERVAL_SEC: ${{ secrets.PANIC_CHECK_INTERVAL_SEC }}
          NEW_LOCATION_TIMEOUT_SEC: ${{ secrets.NEW_LOCATION_TIMEOUT_SEC }}
          RATELIMIT_PREADJUST: ${{ secrets.RATELIMIT_PREADJUST }}
          RATELIMIT_JITTER: ${{ secrets.RATELIMIT_JITTER }}
          # V6: auto channel discovery on 404 (all optional)
          CHANNEL_NAMES: ${{ steps.channels.outputs.ch_names }}
          # Durable per-alt registry is stored in a separate Gist file when
          # CONTROL_GIST_ID + GIST_TOKEN are configured; local JSON is the
          # atomic fallback for self-hosted runners.
          CHANNEL_STATE_FILE: ${{ secrets.CHANNEL_STATE_FILE || '.adfarm_channel_registry.json' }}
          CHANNEL_STATE_GIST_ID: ${{ secrets.CHANNEL_STATE_GIST_ID || secrets.CONTROL_GIST_ID }}
          CONFIRM_USER_IDS: ${{ secrets.CONFIRM_USER_IDS }}
          CONFIRM_TIMEOUT: ${{ secrets.CONFIRM_TIMEOUT }}
          # V6: centralized remote control (all optional; no config required if you don't use the control bot)
          # CONTROLLER_USER_IDS: comma-separated Discord user IDs allowed to DM !commands to this alt.
          #   Should include the official control bot's application ID (or your own ID for manual testing).
          CONTROLLER_USER_IDS: ${{ secrets.CONTROLLER_USER_IDS }}
          # ALT_ID / ALT_NAME: numeric ID 1..N and human-readable label shown on the dashboard (e.g. "Seller A").
          #   Set these PER REPO in GitHub Actions repo variables so each alt identifies itself correctly.
          ALT_ID: ${{ vars.ALT_ID }}
          ALT_NAME: ${{ vars.ALT_NAME }}
          # HEARTBEAT_INTERVAL_SEC: how often the alt pushes a structured heartbeat to DASHBOARD_WEBHOOK_URL.
          #   Default 300 (5 min). Min 60.
          HEARTBEAT_INTERVAL_SEC: ${{ secrets.HEARTBEAT_INTERVAL_SEC }}
          # CONTROL_GIST_ID: shared private queue/override Gist. The control bot
          #   writes control_<ALT_ID>.json so the alt need not join its server;
          #   the sender polls and acknowledges commands with GIST_TOKEN.
          CONTROL_GIST_ID: ${{ secrets.CONTROL_GIST_ID }}
          # SYNC_GIST_INTERVAL_SEC: how often the alt polls the control gist for config changes. Default 45.
          SYNC_GIST_INTERVAL_SEC: ${{ secrets.SYNC_GIST_INTERVAL_SEC }}
          # CONTROL_CMD_PREFIX: prefix character for DM commands (default "!").
          CONTROL_CMD_PREFIX: ${{ secrets.CONTROL_CMD_PREFIX }}
          # V6: per-alt personality jitter. Deterministically nudges typo/react/AFK
          # rates ±12% per ALT_ID so multiple alts don't have identical behavioral
          # fingerprints. Set PERSONALITY_JITTER=0 to disable (all alts use defaults).
          PERSONALITY_JITTER: ${{ secrets.PERSONALITY_JITTER }}
          PYTHONUNBUFFERED: '1'
        run: |
          echo "=== chunk ${{ matrix.chunk }} starting at $(date -u +%H:%M:%SZ) ==="
          python -u send_ads.py
